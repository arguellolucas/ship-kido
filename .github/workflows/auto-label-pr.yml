name: Auto Label PR

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    name: Label Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Auto Add Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const labels = new Set();

            // Default label applied to every new PR
            labels.add('autoship');

            const branch = (pr.head.ref || '').toLowerCase();
            const title = (pr.title || '').toLowerCase();
            const author = (pr.user.login || '').toLowerCase();

            // Detect Aikido AutoFix / AutoShip PRs
            if (branch.startsWith('aikido') || title.includes('aikido') || author.includes('aikido')) {
              labels.add('aikido');
              labels.add('security');
            }

            // Detect dependency bumps
            if (branch.includes('dep') || title.includes('bump') || title.includes('deps')) {
              labels.add('dependencies');
            }

            const labelsToAdd = Array.from(labels);
            console.log(`Adding labels to PR #${pr.number}:`, labelsToAdd);

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labelsToAdd
            });
